name: UI Tests with Allure

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master, develop]

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install backend deps (adjust path if needed)
      - name: Install Backend Python dependencies
        run: pip install -r requirements.txt

      - name: Install UI test Python dependencies
        run: pip install -r tests/ui/requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # ✅ Start BACKEND (FastAPI) in background
      - name: Start Backend server
        run: |
          nohup uvicorn app:app --host 0.0.0.0 --port 8081 > backend.log 2>&1 &
        env:
          # ERPNext settings for the journey test
          ERPNEXT_BASE_URL: ${{ secrets.ERPNEXT_BASE_URL }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
          ERPNEXT_COMPANY: ${{ secrets.ERPNEXT_COMPANY }}

      - name: Wait for Backend server
        run: |
          echo "Waiting for backend at http://localhost:8081/health..."
          timeout 60 bash -c 'until curl -f http://localhost:8081/health > /dev/null 2>&1; do echo "Waiting backend..."; sleep 2; done'
          echo "Backend is ready!"

      # ✅ Build + Start FRONTEND with correct API URL
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8081"

      - name: Start Next.js server
        run: nohup npm run dev -- --port 3001 > frontend.log 2>&1 &
        env:
          NODE_ENV: test
          NEXT_PUBLIC_API_URL: "http://localhost:8081"

      - name: Wait for Next.js server
        run: |
          echo "Waiting for frontend at http://localhost:3001..."
          timeout 60 bash -c 'until curl -f http://localhost:3001 > /dev/null 2>&1; do echo "Waiting frontend..."; sleep 2; done'
          echo "Frontend is ready!"

      # ✅ Run tests
      - name: Run UI tests
        run: pytest tests/ui -v --tb=short --alluredir=allure-results
        env:
          CI: "true"
          HEADLESS: "1"
          UI_URL: "http://localhost:3001"
          BACKEND_BASE_URL: "http://localhost:8081"
          # ERPNext (needed for create invoice test)
          ERPNEXT_BASE_URL: ${{ secrets.ERPNEXT_BASE_URL }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
          ERPNEXT_COMPANY: ${{ secrets.ERPNEXT_COMPANY }}

      - name: Install Allure CLI
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz
          tar -zxf allure-2.25.0.tgz -C /opt
          sudo ln -s /opt/allure-2.25.0/bin/allure /usr/bin/allure

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results -o allure-report --clean

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 7

      # Optional: upload logs for debugging when failing
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend.log
            frontend.log
          retention-days: 7
