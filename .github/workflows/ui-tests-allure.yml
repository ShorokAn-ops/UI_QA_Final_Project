name: UI Tests with Allure

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master, develop]

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      # 3) Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4) Install Python deps for UI tests
      - name: Install UI test Python dependencies
        run: pip install -r tests/ui/requirements.txt

      # 5) Playwright browsers
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # -----------------------------
      # BACKEND (FastAPI) - optional but recommended
      # -----------------------------
      - name: Install Backend Python dependencies (if present)
        run: |
          if [ -f "requirements.txt" ]; then
            echo "Found requirements.txt - installing backend deps..."
            pip install -r requirements.txt
          else
            echo "No requirements.txt found. Skipping backend deps install."
          fi

      - name: Start Backend server (FastAPI)
        run: |
          echo "Starting backend..."
          nohup uvicorn app:app --host 0.0.0.0 --port 8081 > backend.log 2>&1 &
          echo "Backend PID: $!"
          sleep 2

          echo "=== backend.log (first 200 lines) ==="
          sed -n '1,200p' backend.log || true

          echo "=== listening ports (8081) ==="
          sudo ss -ltnp | grep 8081 || true
        env:
          ERPNEXT_BASE_URL: ${{ secrets.ERPNEXT_BASE_URL }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
          ERPNEXT_COMPANY: ${{ secrets.ERPNEXT_COMPANY }}

      - name: Wait for Backend server
        run: |
          echo "Waiting for backend at http://localhost:8081/health ..."
          for i in {1..60}; do
            if curl -fsS http://localhost:8081/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting backend... ($i/60)"
            sleep 1
          done

          echo "Backend did not become ready. Dumping logs:"
          echo "=== backend.log (last 300 lines) ==="
          tail -n 300 backend.log || true

          echo "=== processes (uvicorn/python) ==="
          ps aux | grep -E "uvicorn|python" | grep -v grep || true

          echo "=== listening ports (8081) ==="
          sudo ss -ltnp | grep 8081 || true

          exit 1

      # -----------------------------
      # FRONTEND (Next.js)
      # -----------------------------
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8081"

      - name: Start Next.js server
        run: |
          echo "Starting Next.js..."
          nohup npm run dev -- --port 3001 > frontend.log 2>&1 &
          sleep 2
          echo "=== frontend.log (first 200 lines) ==="
          sed -n '1,200p' frontend.log || true
        env:
          NODE_ENV: test
          NEXT_PUBLIC_API_URL: "http://localhost:8081"

      - name: Wait for Next.js server
        run: |
          echo "Waiting for frontend at http://localhost:3001..."
          for i in {1..60}; do
            if curl -fsS http://localhost:3001 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              exit 0
            fi
            echo "Waiting frontend... ($i/60)"
            sleep 1
          done

          echo "Frontend did not become ready. Dumping logs:"
          echo "=== frontend.log (last 300 lines) ==="
          tail -n 300 frontend.log
