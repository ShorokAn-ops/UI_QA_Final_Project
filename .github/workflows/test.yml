name: UI Tests with Allure Report

on:
  push:
    branches: [main, master, develop, AI_UI_Anomalous-Invoices-and-Suppliers]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch: # Manual trigger button in GitHub Actions

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade pip
          pip install -r tests/ui/requirements.txt
          playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      # Validate required secrets before starting server
      - name: Validate ERPNext Configuration
        run: |
          echo "Validating ERPNext configuration..."
          MISSING=""
          [ -z "${{ secrets.ERPNEXT_BASE_URL }}" ] && [ -z "${{ secrets.ERPNEXT_URL }}" ] && MISSING="${MISSING}ERPNEXT_BASE_URL or ERPNEXT_URL, "
          [ -z "${{ secrets.ERPNEXT_API_KEY }}" ] && MISSING="${MISSING}ERPNEXT_API_KEY, "
          [ -z "${{ secrets.ERPNEXT_API_SECRET }}" ] && MISSING="${MISSING}ERPNEXT_API_SECRET, "
          [ -z "${{ secrets.ERPNEXT_COMPANY }}" ] && MISSING="${MISSING}ERPNEXT_COMPANY, "
          [ -z "${{ secrets.ERPNEXT_ITEM_ID }}" ] && MISSING="${MISSING}ERPNEXT_ITEM_ID, "

          if [ -n "$MISSING" ]; then
            echo "❌ Missing required GitHub Secrets: ${MISSING%??}"
            echo "Please configure these secrets in your repository settings."
            echo "See GITHUB_SECRETS_SETUP.md for detailed instructions."
            exit 1
          fi
          echo "✅ All required secrets are configured"

      # Start Next.js in background (production mode is more stable in CI)
      - name: Start Next.js server
        run: |
          echo "Starting Next.js server with ERPNext config..."
          echo "ERPNEXT_BASE_URL: ${ERPNEXT_BASE_URL}"
          echo "Credentials configured: $([ -n "$ERPNEXT_API_KEY" ] && echo 'yes' || echo 'no')"
          nohup npm run start > server.log 2>&1 &
          echo $! > .next-pid
          sleep 5
        env:
          PORT: 3001
          ERPNEXT_BASE_URL: ${{ secrets.ERPNEXT_BASE_URL || secrets.ERPNEXT_URL }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
          ERPNEXT_COMPANY: ${{ secrets.ERPNEXT_COMPANY }}
          ERPNEXT_ITEM_ID: ${{ secrets.ERPNEXT_ITEM_ID }}
          ERPNEXT_SUPPLIER: ${{ secrets.ERPNEXT_SUPPLIER || 'NovaTech Trading' }}
          ERPNEXT_CURRENCY: ${{ secrets.ERPNEXT_CURRENCY || 'USD' }}
          ERPNEXT_CONVERSION_RATE: ${{ secrets.ERPNEXT_CONVERSION_RATE || '1' }}

      # Wait for server to be ready
      - name: Wait for server
        run: |
          echo "Waiting for server..."
          for i in {1..30}; do
            if curl -f http://localhost:3001 > /dev/null 2>&1; then
              echo "✅ Server is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 2
          done
          echo "❌ Server failed to start. Logs:"
          cat server.log
          exit 1

      - name: Run Playwright tests with Allure
        run: pytest tests/ui -v --alluredir=allure-results
        env:
          CI: true
          HEADLESS: '1'
          GITHUB_ACTIONS: true
          UI_BASE_URL: http://localhost:3001
          # ERPNext connection (these are passed to Next.js server, not used directly by tests)
          ERPNEXT_BASE_URL: ${{ secrets.ERPNEXT_BASE_URL || secrets.ERPNEXT_URL }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
          ERPNEXT_COMPANY: ${{ secrets.ERPNEXT_COMPANY }}
          ERPNEXT_ITEM_ID: ${{ secrets.ERPNEXT_ITEM_ID }}
        continue-on-error: true

      # Stop server and show logs
      - name: Stop Next.js server
        if: always()
        run: |
          if [ -f .next-pid ]; then
            kill $(cat .next-pid) || true
          fi
          echo "Server logs:"
          cat server.log || true

      - name: Generate Allure report
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz
          tar -zxvf allure-2.25.0.tgz
          ./allure-2.25.0/bin/allure generate allure-results -o allure-report --clean

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
          retention-days: 7
