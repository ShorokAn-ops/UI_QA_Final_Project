name: Test CI

on:
  push:
    branches: [main, master, develop, AI_UI_Anomalous-Invoices-and-Suppliers]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade pip
          pip install -r tests/ui/requirements.txt
          playwright install --with-deps chromium

      - name: Build Next.js
        run: npm run build

      # Start Next.js in background (production mode is more stable in CI)
      - name: Start Next.js server
        run: |
          nohup npm run start > server.log 2>&1 &
          echo $! > .next-pid
          sleep 5
        env:
          PORT: 3001

      # Wait for server to be ready
      - name: Wait for server
        run: |
          echo "Waiting for server..."
          for i in {1..30}; do
            if curl -f http://localhost:3001 > /dev/null 2>&1; then
              echo "✅ Server is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 2
          done
          echo "❌ Server failed to start. Logs:"
          cat server.log
          exit 1

      - name: Run Playwright tests with Allure
        run: pytest tests/ui -v --alluredir=allure-results
        env:
          CI: true
          HEADLESS: '1'
          GITHUB_ACTIONS: true
          APP_URL: http://localhost:3001
          # ERPNext connection (use GitHub Secrets)
          ERPNEXT_BASE_URL: ${{ secrets.ERPNEXT_BASE_URL || secrets.ERPNEXT_URL || 'https://demo.erpnext.com' }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY || 'demo_key' }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET || 'demo_secret' }}
          ERPNEXT_COMPANY: ${{ secrets.ERPNEXT_COMPANY || 'Demo Company' }}
          ERPNEXT_ITEM_ID: ${{ secrets.ERPNEXT_ITEM_ID || 'Demo Item' }}
          ERPNEXT_SUPPLIER: ${{ secrets.ERPNEXT_SUPPLIER || 'Demo Supplier' }}
          # Optional ERPNext settings
          ERPNEXT_CURRENCY: ${{ secrets.ERPNEXT_CURRENCY || 'USD' }}
          ERPNEXT_CONVERSION_RATE: ${{ secrets.ERPNEXT_CONVERSION_RATE || '1' }}
        continue-on-error: true

      # Stop server and show logs
      - name: Stop Next.js server
        if: always()
        run: |
          if [ -f .next-pid ]; then
            kill $(cat .next-pid) || true
          fi
          echo "Server logs:"
          cat server.log || true

      - name: Generate Allure report
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz
          tar -zxvf allure-2.25.0.tgz
          ./allure-2.25.0/bin/allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
          retention-days: 7
