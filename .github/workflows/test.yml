name: Test CI

on:
  push:
    branches: [main, master, develop, AI_UI_Anomalous-Invoices-and-Suppliers]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]
        python-version: ['3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Node dependencies
        run: npm install

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run lint
        run: npm run lint
        continue-on-error: false

      - name: Run Node tests
        run: npm test
        if: always()

      - name: Build project
        run: npm run build

      - name: Check build artifacts
        run: |
          if [ -d ".next" ]; then
            echo "✅ Build successful - .next directory created"
            ls -la .next
          else
            echo "❌ Build failed - .next directory not found"
            exit 1
          fi

      - name: Start Next.js server
        run: npm run dev &
        env:
          NODE_ENV: test

      - name: Wait for server
        run: |
          echo "Waiting for Next.js server to start..."
          timeout 60 bash -c 'until curl -f http://localhost:3001 > /dev/null 2>&1; do sleep 2; done' || echo "Server may not be ready"

      - name: Run Playwright/pytest tests
        run: pytest tests/ -v -m "not erpnext_integration"
        env:
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-node${{ matrix.node-version }}-py${{ matrix.python-version }}
          path: .next
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node${{ matrix.node-version }}-py${{ matrix.python-version }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
