name: UI Tests with Allure Report

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger button in GitHub Actions

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade pip
          pip install -r tests/ui/requirements.txt
          playwright install --with-deps chromium  
    
      - name: Run Playwright tests with Allure
        run: pytest tests/ui -v --alluredir=allure-results
        env:
          CI: true
          HEADLESS: '1'
          GITHUB_ACTIONS: true
          UI_BASE_URL: https://untrusted-cythia-unpunctilious.ngrok-free.dev
        continue-on-error: true

      - name: Generate Allure report
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz
          tar -zxvf allure-2.25.0.tgz
          ./allure-2.25.0/bin/allure generate allure-results -o allure-report --clean

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
          retention-days: 7
